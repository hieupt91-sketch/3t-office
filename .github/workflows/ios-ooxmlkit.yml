# Kiểm OOXMLKit đa nền:
#  - job linux  (ubuntu + swift container): chứng minh engine chạy ngoài Apple bằng swift-corelibs-foundation
#    — chính là bộ Foundation mà Windows và Android cũng dùng, nên đây là bằng chứng đa nền rẻ nhất (rẻ ~10x macOS).
#  - job ios    (macOS thật): swift test, build iPhone/iPad arm64, test simulator iPhone + iPad.
# Chỉ chạy khi mã ports/ios đổi.
name: iOS OOXMLKit

on:
  push:
    paths: ["ports/ios/**", ".github/workflows/ios-ooxmlkit.yml"]
  pull_request:
    paths: ["ports/ios/**", ".github/workflows/ios-ooxmlkit.yml"]
  workflow_dispatch:

concurrency:
  group: ios-ooxmlkit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: swift:6.0
    defaults:
      run:
        working-directory: ports/ios/OOXMLKit
        shell: bash -eo pipefail {0}
    steps:
      - uses: actions/checkout@v4
      - name: Phiên bản Swift (Linux, swift-corelibs-foundation)
        run: swift --version
      - name: swift test (Linux, debug)
        run: swift test 2>&1 | grep -E "error:|Test Suite '.*xctest'|Executed [0-9]+ tests"
      - name: swift test (Linux, release)
        run: swift test -c release -Xswiftc -enable-testing 2>&1 | grep -E "error:|Executed [0-9]+ tests"

  # SPIKE (Bước 1 lộ trình đa nền): chứng minh OOXMLKit build/test được trên Windows (Swift-on-Windows).
  # continue-on-error để lần đầu dò đường không làm đỏ cả workflow; gỡ cờ này khi đã xanh ổn định.
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - uses: compnerd/gha-setup-swift@main
        with:
          branch: swift-6.0.3-release
          tag: 6.0.3-RELEASE
      - uses: actions/checkout@v4
      - name: Phiên bản Swift (Windows)
        run: swift --version
      - name: swift build (Windows)
        working-directory: ports/ios/OOXMLKit
        run: swift build
      - name: swift test (Windows)
        working-directory: ports/ios/OOXMLKit
        run: swift test

  ios:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ports/ios/OOXMLKit
        # pipefail: lỗi của swift/xcodebuild không bị che bởi grep/tail phía sau.
        shell: bash -eo pipefail {0}
    steps:
      - uses: actions/checkout@v4
      - name: Phiên bản công cụ
        run: xcodebuild -version && swift --version
      - name: swift test (macOS)
        run: swift test 2>&1 | grep -E "error:|Test Suite '.*xctest'|Executed [0-9]+ tests"
      - name: Build cho thiết bị iOS/iPadOS (arm64, không ký)
        run: |
          xcodebuild build -scheme OOXMLKit-Package -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO -quiet
      - name: Chọn simulator iPhone và iPad
        id: sim
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, subprocess
          d = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"]))
          devs = [x for k, v in d["devices"].items() if "iOS" in k for x in v]
          iphone = next(x["udid"] for x in devs if x["name"].startswith("iPhone"))
          ipad = next(x["udid"] for x in devs if x["name"].startswith("iPad"))
          print(f"iphone={iphone}\nipad={ipad}")
          PY
      - name: Test trên simulator iPhone
        run: |
          xcodebuild test -scheme OOXMLKit-Package -destination "id=${{ steps.sim.outputs.iphone }}" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | grep -E "error:|Test Suite '.*xctest' (passed|failed)|Test Case .* failed|Executed [0-9]+ tests"
      - name: Test trên simulator iPad
        run: |
          xcodebuild test -scheme OOXMLKit-Package -destination "id=${{ steps.sim.outputs.ipad }}" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | grep -E "error:|Test Suite '.*xctest' (passed|failed)|Test Case .* failed|Executed [0-9]+ tests"
