<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VN Office — Bộ Ứng Dụng Văn Phòng Việt</title>
  <link rel="icon" id="vno-favicon" href="branding/icons/vnoffice.ico" type="image/x-icon">
  
  <!-- Phông chữ Tiếng Việt chuẩn quốc gia -->
  <!-- Đóng gói sẵn trong app (SIL OFL) để không cần mạng — ứng dụng desktop chạy offline -->
  <link rel="stylesheet" href="platform/theme/fonts/fonts.css">

  <!-- Design System & Tokens -->
  <link rel="stylesheet" href="platform/theme/tokens.css">
  <link rel="stylesheet" href="platform/ui-kit/ui-kit.css">
  <link rel="stylesheet" href="platform/ribbon/ribbon.css">
  <link rel="stylesheet" href="platform/shell/shell.css">
  <link rel="stylesheet" href="platform/error_reporting/error-reporting.css">
  <link rel="stylesheet" href="platform/splash/splash.css">
  <link rel="stylesheet" href="platform/about/about-dialog.css">

  <!-- Apps Specific Styles -->
  <link rel="stylesheet" href="apps/writer/writer.css">
  <link rel="stylesheet" href="apps/sheet/sheet.css">
  <link rel="stylesheet" href="apps/slides/slides.css">
</head>
<body>

  <!-- 3T Office Startup Splash Screen (hiển thị tức thì khi mở cửa sổ) -->
  <div id="vno-splash-screen" class="vno-splash-screen" role="status" aria-live="polite" aria-busy="true">
    <div class="vno-splash-card">
      <div class="vno-splash-logo-wrap">
        <img src="branding/3t/3t-mark.png" alt="3T Logo" class="vno-splash-logo" width="84" height="84">
      </div>
      <div class="vno-splash-brand">
        <div class="vno-splash-brand-title">
          <span class="vno-splash-brand-3t">3T</span>
          <span class="vno-splash-brand-office">Office</span>
        </div>
        <div class="vno-splash-app-badge" id="vno-splash-app-name" data-app="writer">3T Doc</div>
      </div>
      <div class="vno-splash-status">
        <div class="vno-splash-spinner" aria-hidden="true"></div>
        <span class="vno-splash-text" id="vno-splash-status-text">Đang khởi động…</span>
      </div>
      <div class="vno-splash-footer">
        <span>© 3T Technology · Bộ Ứng Dụng Văn Phòng Việt</span>
      </div>
    </div>
  </div>

  <script>
    // Nhận diện app từ URL parameters tức thì ngay trong luồng HTML đầu tiên
    (function() {
      try {
        var p = new URLSearchParams(window.location.search);
        var app = (p.get("app") || "writer").toLowerCase();
        var badge = document.getElementById("vno-splash-app-name");
        if (badge) {
          badge.setAttribute("data-app", app);
          if (app === "sheet") badge.textContent = "3T Sheet";
          else if (app === "slides") badge.textContent = "3T Slide";
          else badge.textContent = "3T Doc";
        }
      } catch (e) {}
    })();
  </script>

  <!-- App Mount Root -->
  <div id="vno-app-root"></div>

  <script type="module">
    import { WriterApp } from "./apps/writer/writer-app.js";
    import { SheetApp } from "./apps/sheet/sheet-app.js";
    import { SlidesApp } from "./apps/slides/slides-app.js";
    import { themeManager } from "./platform/theme/theme-manager.js";
    import { globalCommandBus } from "./platform/commands/command-bus.js";
    import { bootstrapPlatform, configurePlatformLaunchContext, resolveLaunchContext } from "./platform/bootstrap.js";
    import { ErrorReportingUI } from "./platform/error_reporting/error-reporting-ui.js";
    import { autoRecoverManager } from "./platform/autorecover/auto-recover.js";
    import { connectUpdaterUi } from "./platform/updater/update-ui.js";
    import { showDocumentOpenProgress, hideDocumentOpenProgress } from "./platform/ui-kit/components.js";
    import { setSplashStatus, hideSplashScreen } from "./platform/splash/splash.js";

    window.addEventListener("vno:document-open-progress", () => {
      showDocumentOpenProgress("Đang mở tài liệu…");
    });
    window.addEventListener("vno:document-open-complete", () => {
      requestAnimationFrame(() => requestAnimationFrame(hideDocumentOpenProgress));
    });

    const mountEl = document.getElementById("vno-app-root");
    window.__vnoPerfDebug = new URLSearchParams(window.location.search).get("perfDebug") === "1";
    window.__vnoPerfReport = (name, elapsedMs) => {
      if (!window.__vnoPerfDebug) return;
      console.info(`[VNO Sheet Perf] ${name}: ${elapsedMs.toFixed(1)} ms`);
      window.pywebview?.api?.report_perf_metric?.(name, elapsedMs);
    };
    let currentAppInstance = null;
    const launchContext = configurePlatformLaunchContext(resolveLaunchContext(window.location.search));
    const errorReportingUI = new ErrorReportingUI().mount();

    async function switchApp(appType, options = {}) {
      if (launchContext.singleAppMode && appType !== launchContext.appKind) return false;
      themeManager.setApp(appType);
      const faviconEl = document.getElementById("vno-favicon");
      if (faviconEl) {
        faviconEl.href = `branding/icons/${appType}.ico`;
      }

      if (appType === "writer") {
        currentAppInstance = new WriterApp(mountEl);
      } else if (appType === "sheet") {
        currentAppInstance = new SheetApp(mountEl);
      } else if (appType === "slides") {
        currentAppInstance = new SlidesApp(mountEl);
      }

      await currentAppInstance.init({ ...options, singleApp: launchContext.singleAppMode });
      await errorReportingUI.refresh();
      // Bộ đo (scripts/layout-audit/_create_new_*.py) điều khiển app thật qua handle này; không dùng trong code sản phẩm.
      window.__vnoAppInstance = currentAppInstance;
      await connectUpdaterUi(currentAppInstance);

      // Cập nhật callback chuyển đổi app vào shell hiện tại
      if (currentAppInstance.shell) {
        currentAppInstance.shell.onSwitchApp = (nextApp, opt) => switchApp(nextApp, opt);
      }
      return true;
    }

    // Khởi tạo theme (Light/Dark từ localStorage)
    themeManager.init();

    // Bootstrap suite tập trung một lần duy nhất rồi khởi động VN Writer
    await bootstrapPlatform();
    const initialApp = launchContext.appKind || "writer";
    await switchApp(initialApp, {
      singleApp: launchContext.singleAppMode,
      templateId: "blank",
      openInitialFile: launchContext.openInitialFile
    });
    await errorReportingUI.initialize();
    if (launchContext.openInitialFile) {
      await globalCommandBus.execute("common.file.open");
    }
    await autoRecoverManager.showStartupRecovery();
    setSplashStatus("Sẵn sàng…");
    hideSplashScreen();
  </script>
</body>
</html>
